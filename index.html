<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website</title>
    <script>
        // Apni URLs niche quotation marks ke andar paste karein:
        const TOS_URL = ""; 
        const DISCORD_URL = ""; 
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            position: relative;
        }

        /* Top Left Header (Logo + Title/Icon) */
        .header-left {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 50px;
            height: 50px;
            object-fit: contain;
            border-radius: 8px;
        }

        .site-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #e2e8f0;
        }

        /* Top Right Button */
        .top-right-container {
            position: absolute;
            top: 20px;
            right: 20px;
        }

        .btn-top {
            background-color: #3b82f6;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            text-decoration: none;
            display: inline-block;
        }

        .btn-top:hover {
            background-color: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px -2px rgba(59, 130, 246, 0.4);
        }

        /* Main Center Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            margin-top: 80px;
            margin-bottom: 100px;
        }

        .main-logo {
            width: 120px;
            height: 120px;
            object-fit: contain;
            margin-bottom: 24px;
        }

        /* Bottom Large Button Container */
        .bottom-container {
            width: 100%;
            display: flex;
            justify-content: center;
            padding-bottom: 20px;
        }

        .btn-bottom-large {
            background: linear-gradient(135deg, #5865f2 0%, #4752c4 100%);
            color: #ffffff;
            border: none;
            padding: 20px 48px;
            font-size: 1.5rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 15px -3px rgba(88, 101, 242, 0.3);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            max-width: 400px;
            justify-content: center;
        }

        .btn-bottom-large:hover {
            background: linear-gradient(135deg, #4752c4 0%, #3c45a5 100%);
            transform: translateY(-3px);
            box-shadow: 0 14px 20px -4px rgba(88, 101, 242, 0.5);
        }

        @media (max-width: 600px) {
            .header-left {
                position: static;
                margin-bottom: 20px;
            }
            .top-right-container {
                position: static;
                margin-bottom: 20px;
            }
            body {
                align-items: center;
            }
            .btn-bottom-large {
                font-size: 1.2rem;
                padding: 16px 32px;
            }
        }
    </style>
</head>
<body>

    <!-- Top Left Header (Logo & Icon) -->
    <div class="header-left">
        <img src="logo.png" alt="Logo" class="logo">
        <span class="site-title">My Server</span>
    </div>

    <!-- Top Right Corner Button -->
    <div class="top-right-container">
        <button class="btn-top" onclick="if(TOS_URL) window.location.href=TOS_URL; else alert('Kripya TOS_URL set karein!');">
            Terms of Service
        </button>
    </div>

    <!-- Main Content Area -->
    <main class="main-content">
        <img src="logo.png" alt="Main Logo" class="main-logo">
        <h1>Welcome to Community</h1>
        <p style="color: #94a3b8; margin-top: 8px;">Join our community server today!</p>
    </main>

    <!-- Bottom Center Large Button -->
    <div class="bottom-container">
        <button class="btn-bottom-large" onclick="if(DISCORD_URL) window.location.href=DISCORD_URL; else alert('Kripya DISCORD_URL set karein!');">
            Discord Server
        </button>
    </div>

</body>
</html>
